<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#1f5c45">

    <title>Cadastro de Times</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <header>
      <div class="container">
        <h1>Cadastro de Times</h1>
        <p>Gerencie os Times cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">

      <section class="painel">

        <h2 id="titulo-formulario">
          Novo Time
        </h2>

        <form id="form-time">

          <input
            type="hidden"
            id="time-id"
          >

          <label for="nome">
            Nome
          </label>

          <input
            id="nome"
            name="nome"
            type="text"
            required
          >

          <label for="pais">
            País
          </label>

          <input
            id="pais"
            name="pais"
            type="text"
            required
          >

          <label for="ano">
            Ano
          </label>

          <input
            id="ano"
            name="ano"
            type="number"
            min="1800"
            required
          >

          <div class="acoes-formulario">

            <button
              type="submit"
              id="botao-salvar"
            >
              Cadastrar
            </button>

            <button
              type="button"
              id="botao-cancelar"
              class="secundario oculto"
            >
              Cancelar edição
            </button>

          </div>

        </form>

      </section>

      <section class="painel">

        <div class="cabecalho-lista">

          <h2>Times</h2>

          <button
            type="button"
            id="botao-atualizar"
            class="secundario"
          >
            Atualizar lista
          </button>

        </div>

        <form
          id="form-busca"
          class="busca"
        >

          <label for="busca-id">
            Buscar time pelo ID
          </label>

          <div class="linha-busca">

            <input
              id="busca-id"
              type="text"
              placeholder="Informe o ID do time"
            >

            <button type="submit">
              Buscar
            </button>

            <button
              type="button"
              id="botao-limpar-busca"
              class="secundario"
            >
              Listar todos
            </button>

          </div>

        </form>

        <p
          id="mensagem"
          role="status"
          aria-live="polite"
        ></p>

        <div
          id="lista-times"
          class="lista-times"
        ></div>

      </section>

    </main>

    <script src="app.js"></script>

  </body>
</html>
